---
__bind_os_packages: [bind9, bind9-utils, bind9-dnsutils]
__bind_os_service: named
__bind_os_config: /etc/bind/named.conf
__bind_os_conf_dir: /etc/bind
__bind_os_dir: /var/cache/bind
# AppArmor lets named write to /var/lib/bind and /var/cache/bind.
__bind_os_zone_dir: /var/lib/bind
__bind_os_secondary_dir: /var/cache/bind/secondary
__bind_os_managed_keys_dir: /var/cache/bind
__bind_os_user: bind
__bind_os_group: bind
__bind_os_root_hints: ""
__bind_os_default_includes:
  - /etc/bind/named.conf.default-zones
