---
# Partial dicts from the inventory are merged over these defaults.
__bind_listen: "{{ {'ipv4': ['127.0.0.1'], 'ipv6': ['::1'], 'port': 53} | combine(bind_listen) }}"

__bind_options: >-
  {{ {'recursion': false,
      'allow_query': ['localhost'],
      'allow_recursion': ['localhost', 'localnets'],
      'allow_transfer': ['none'],
      'forwarders': [],
      'forward': 'first',
      'dnssec_validation': 'auto',
      'validate_except': [],
      'query_log': false,
      'zone_statistics': none,
      'rate_limit': {}} | combine(bind_options) }}

# DoT, DoH and XoT. TLS 1.2 is kept for clients without 1.3, restricted to
# forward-secret AEAD ciphers; session tickets are off so a stolen ticket key
# cannot decrypt recorded sessions.
__bind_tls: >-
  {{ {'protocols': ['TLSv1.2', 'TLSv1.3'],
      'ciphers': 'ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!SHA1:!SHA256:!SHA384'} | combine(bind_tls) }}
__bind_dot: "{{ {'enabled': false, 'port': 853} | combine(bind_dot) }}"
__bind_doh: "{{ {'enabled': false, 'port': 443, 'endpoints': ['/dns-query']} | combine(bind_doh) }}"
__bind_tls_dir: "{{ bind_conf_dir }}/tls"
__bind_tls_cert: "{{ __bind_tls.cert_file | default(__bind_tls_dir ~ '/server.pem') }}"
__bind_tls_key: "{{ __bind_tls.key_file | default(__bind_tls_dir ~ '/server.key') }}"
__bind_tls_ca: "{{ __bind_tls.ca_file | default(__bind_tls_dir ~ '/ca.pem') }}"

__bind_zone_defaults: >-
  {{ {'ttl': '1h', 'refresh': '1d', 'retry': '1h', 'expire': '1w',
      'minimum': '1h', 'hostmaster': 'hostmaster'} | combine(bind_zone_defaults) }}

__bind_statistics: >-
  {{ {'enabled': false, 'host': '127.0.0.1', 'port': 8053,
      'allow': ['127.0.0.1']} | combine(bind_statistics) }}

__bind_keys_file: "{{ bind_conf_dir }}/tsig-keys.conf"
# Shared by every local zone without records. Kept out of the zone
# directories so no zone name can collide with it.
__bind_local_empty_file: "{{ bind_conf_dir }}/local-empty.zone"
__bind_min_version: "9.18"
__bind_today: "{{ now(utc=true, fmt='%Y%m%d') }}"
