---
__bind_os_packages: [bind, bind-utils]
__bind_os_service: named
__bind_os_config: /etc/named.conf
__bind_os_conf_dir: /etc/named
__bind_os_dir: /var/named
__bind_os_zone_dir: /var/named
# /var/named/slaves is labelled named_cache_t, so named may write there under SELinux.
__bind_os_secondary_dir: /var/named/slaves
__bind_os_managed_keys_dir: /var/named/dynamic
# Dynamic zones need a directory named may write to (named_cache_t).
__bind_os_dynamic_dir: /var/named/dynamic
__bind_os_user: named
__bind_os_group: named
__bind_os_root_hints: named.ca
__bind_os_default_includes:
  - /etc/named.rfc1912.zones
