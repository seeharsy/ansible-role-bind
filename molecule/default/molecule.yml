---
# Primary/secondary pair with recursion, several forward domains, shared and
# expanded reverse zones, TSIG-signed and ACL-based transfers, and a forward
# zone.
#
# MOLECULE_IMAGE   base image (default docker.io/rockylinux/rockylinux:10)
# MOLECULE_DISTRO  short name; keys container, network and image names
# MOLECULE_NET     third octet of the test subnet 172.30.<n>.0/24
# Unique values for all three let several distros run at the same time; see
# molecule/run-all.sh.
driver:
  name: docker
platforms:
  - name: ns1-${MOLECULE_DISTRO:-rockylinux10}
    docker_networks:
      - name: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
        ipam_config:
          - subnet: 172.30.${MOLECULE_NET:-53}.0/24
    buildargs:
      BASE_IMAGE: ${MOLECULE_IMAGE:-docker.io/rockylinux/rockylinux:10}
    image: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
    dockerfile: ../resources/Dockerfile.j2
    pre_build_image: false
    groups: [bind, primary]
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
        ipv4_address: 172.30.${MOLECULE_NET:-53}.11
  - name: ns2-${MOLECULE_DISTRO:-rockylinux10}
    buildargs:
      BASE_IMAGE: ${MOLECULE_IMAGE:-docker.io/rockylinux/rockylinux:10}
    image: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
    dockerfile: ../resources/Dockerfile.j2
    pre_build_image: false
    groups: [bind, secondary]
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
        ipv4_address: 172.30.${MOLECULE_NET:-53}.12
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
      callback_result_format: yaml
  inventory:
    links:
      group_vars: group_vars/
verifier:
  name: ansible
