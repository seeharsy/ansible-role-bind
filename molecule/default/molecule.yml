---
# Primary/secondary pair with recursion, several forward domains, shared and
# expanded reverse zones, TSIG-signed and ACL-based transfers, and a forward
# zone. Set MOLECULE_IMAGE to the base image (default rockylinux/rockylinux:10)
# and MOLECULE_DISTRO to a matching short name used for the built image tag.
driver:
  name: docker
platforms:
  - name: ns1
    docker_networks:
      - name: molecule-bind
        ipam_config:
          - subnet: 172.30.53.0/24
    buildargs:
      BASE_IMAGE: ${MOLECULE_IMAGE:-docker.io/rockylinux/rockylinux:10}
    image: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
    dockerfile: ../resources/Dockerfile.j2
    pre_build_image: false
    groups: [bind]
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: molecule-bind
        ipv4_address: 172.30.53.11
  - name: ns2
    buildargs:
      BASE_IMAGE: ${MOLECULE_IMAGE:-docker.io/rockylinux/rockylinux:10}
    image: molecule-bind-${MOLECULE_DISTRO:-rockylinux10}
    dockerfile: ../resources/Dockerfile.j2
    pre_build_image: false
    groups: [bind]
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: molecule-bind
        ipv4_address: 172.30.53.12
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
      callback_result_format: yaml
  inventory:
    links:
      group_vars: group_vars/
      host_vars: host_vars/
verifier:
  name: ansible
