---
# Test network and roles; see molecule.yml.
test_net: "172.30.{{ lookup('ansible.builtin.env', 'MOLECULE_NET') | default('53', true) }}"
test_ns1_ip: "{{ test_net }}.11"
test_ns2_ip: "{{ test_net }}.12"
test_primary: "{{ groups['primary'] | first }}"
test_ip: "{{ test_ns1_ip if inventory_hostname in groups['primary'] else test_ns2_ip }}"
test_tls_name: "{{ 'ns1' if inventory_hostname in groups['primary'] else 'ns2' }}.example.test"
# Created by prepare.yml.
test_pki: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"

# Test fixtures only. These are not real keys.
test_tsig_secret: dGVzdC1vbmx5LW5vdC1hLXJlYWwta2V5LWRvLW5vdC11c2U=
test_ddns_secret: dGVzdC1vbmx5LWRkbnMta2V5LW5vdC1mb3ItcmVhbC11c2U=

bind_listen:
  ipv4: [any]
  ipv6: []

# DoT and DoH on both servers, with certificates from the test CA.
bind_tls:
  cert: "{{ lookup('ansible.builtin.file', test_pki ~ '/' ~ test_tls_name ~ '.pem') }}"
  key: "{{ lookup('ansible.builtin.file', test_pki ~ '/' ~ test_tls_name ~ '.key') }}"
  ca: "{{ lookup('ansible.builtin.file', test_pki ~ '/ca.pem') }}"

bind_dot:
  enabled: true

bind_doh:
  enabled: true

bind_acls:
  - name: secondaries
    match: ["{{ test_ns2_ip }}"]
  - name: clients
    match: ["{{ test_net }}.0/24", localhost]

bind_options:
  recursion: true
  allow_query: [clients]
  allow_recursion: [clients]
  dnssec_validation: auto
  query_log: true
  zone_statistics: terse
  # Log-only, and every test client is exempt, so it never slows the checks.
  rate_limit:
    responses_per_second: 20
    window: 5
    exempt_clients: [clients]
    log_only: true

bind_tsig_keys:
  - name: xfer
    algorithm: hmac-sha256
    secret: "{{ test_tsig_secret }}"
  - name: ddns
    algorithm: hmac-sha256
    secret: "{{ test_ddns_secret }}"

bind_zone_defaults:
  ttl: 5m
  refresh: 2d
  retry: 2h
  expire: 2w
  minimum: 5m

bind_statistics:
  enabled: true

test_zones:
  # Transfers are TSIG-signed and only accepted over TLS.
  - name: example.test
    primary: "{{ test_primary }}"
    xot: true
    primaries:
      - address: "{{ test_ns1_ip }}"
        key: xfer
        tls_name: ns1.example.test
    name_servers: [ns1, ns2]
    allow_transfer: ["key xfer"]
    statistics: full
    reverse_zones: [192.0.2.0/24, 198.18.0.0/20, "2001:db8::/64"]
    hosts:
      - {name: ns1, ip: "{{ test_ns1_ip }}"}
      - {name: ns2, ip: "{{ test_ns2_ip }}"}
      - {name: www, ip: 192.0.2.12, aliases: [web]}
      - {name: gitlab, ip: 192.0.2.28, aliases: [git]}
      - {name: "*.pages.gitlab", ip: 192.0.2.28}
      - {name: multi, ip: [192.0.2.30, 192.0.2.31]}
      - {name: dual, ip: 192.0.2.40, ipv6: "2001:db8::10"}
      - {name: mail, ip: 192.0.2.25}
      - {name: big, ip: 198.18.5.9}
    records:
      - {name: "@", type: MX, value: "10 mail"}
      - {name: sub, type: MX, value: "10 mail"}
      - {name: "@", type: TXT, value: '"v=spf1 -all"'}
      - {name: _ntp._udp, type: SRV, value: "0 100 123 www"}
      - {name: _ntp._udp, type: SRV, value: "0 100 123 gitlab"}
  # Shares 192.0.2.0/24 with example.test, so it must use the same transfer policy.
  - name: second.test
    primary: "{{ test_primary }}"
    xot: true
    primaries:
      - address: "{{ test_ns1_ip }}"
        key: xfer
        tls_name: ns1.example.test
    name_servers: [ns1.example.test., ns2.example.test.]
    hostmaster: dns.admin@example.test
    ttl: 60
    statistics: none
    allow_transfer: ["key xfer"]
    reverse_zones: [192.0.2.0/24]
    hosts:
      - {name: box, ip: 192.0.2.50}

  # Updated with nsupdate; the role only writes the first version. Transfers
  # stay on plain TCP, signed with TSIG.
  - name: dyn.test
    primary: "{{ test_primary }}"
    primaries:
      - address: "{{ test_ns1_ip }}"
        key: xfer
    name_servers: [ns1.example.test., ns2.example.test.]
    allow_transfer: ["key xfer"]
    update_policy:
      - {key: ddns, match: zonesub, types: [A, TXT]}
    hosts:
      - {name: seed, ip: 192.0.2.60}

bind_zones: "{{ test_zones }}"

bind_local_zones:
  - name: blocked.test
  - name: sink.test
    statistics: full
    records:
      - {name: "*", type: A, value: 192.0.2.250}
  - name: quiet.test
    allow_query: [localhost]
