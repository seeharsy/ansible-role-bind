---
- name: Verify answers from both servers
  hosts: secondary
  gather_facts: false
  vars:
    servers: ["{{ test_ns1_ip }}", "{{ test_ns2_ip }}"]
    checks:
      - {q: www.example.test, t: A, want: [192.0.2.12]}
      - {q: web.example.test, t: CNAME, want: [www.example.test.]}
      - {q: multi.example.test, t: A, want: [192.0.2.30, 192.0.2.31]}
      - {q: anything.pages.gitlab.example.test, t: A, want: [192.0.2.28]}
      - {q: dual.example.test, t: AAAA, want: ["2001:db8::10"]}
      - {q: example.test, t: MX, want: [10 mail.example.test.]}
      - {q: sub.example.test, t: MX, want: [10 mail.example.test.]}
      - {q: example.test, t: TXT, want: ['"v=spf1 -all"']}
      - {q: _ntp._udp.example.test, t: SRV, want: [0 100 123 gitlab.example.test., 0 100 123 www.example.test.]}
      - {q: box.second.test, t: A, want: [192.0.2.50]}
      - {x: 192.0.2.28, t: PTR, want: [gitlab.example.test.]}
      - {x: 192.0.2.31, t: PTR, want: [multi.example.test.]}
      - {x: 192.0.2.50, t: PTR, want: [box.second.test.]}
      - {x: 198.18.5.9, t: PTR, want: [big.example.test.]}
      - {x: "2001:db8::10", t: PTR, want: [dual.example.test.]}
    authoritative_zones:
      - example.test
      - second.test
      - 2.0.192.in-addr.arpa
      - 0.18.198.in-addr.arpa
      - 5.18.198.in-addr.arpa
      - 15.18.198.in-addr.arpa
      - 0.0.0.0.0.0.0.0.8.b.d.0.1.0.0.2.ip6.arpa
  tasks:
    - name: Query each record on each server
      ansible.builtin.command:
        argv: "{{ ['dig', '+short', '+norec', '@' + item.0]
                  + (['-x', item.1.x] if item.1.x is defined else [item.1.q, item.1.t]) }}"
      loop: "{{ servers | product(checks) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.x | default(item.1.q) }} {{ item.1.t }}"
      register: answers
      changed_when: false

    - name: Check each answer
      ansible.builtin.assert:
        that: (item.stdout_lines | sort) == (item.item.1.want | map('string') | sort)
        fail_msg: >-
          {{ item.item.0 }} answered {{ item.stdout_lines }} for
          {{ item.item.1.x | default(item.item.1.q) }} {{ item.item.1.t }};
          expected {{ item.item.1.want }}
        quiet: true
      loop: "{{ answers.results }}"
      loop_control:
        label: "{{ item.item.0 }} {{ item.item.1.x | default(item.item.1.q) }}"

    - name: Read SOA records with flags
      ansible.builtin.command:
        argv: [dig, +norec, +noall, +comments, +answer, "@{{ item.0 }}", "{{ item.1 }}", SOA]
      loop: "{{ servers | product(authoritative_zones) | list }}"
      register: soa
      changed_when: false

    - name: Check both servers answer authoritatively with the same serial
      ansible.builtin.assert:
        that:
          - item | map(attribute='stdout') | select('search', 'flags:[a-z ]* aa[ ;]') | list | length == 2
          - serials | unique | length == 1
          - serials[0] | int > 0
        fail_msg: "{{ item | map(attribute='stdout') | list }}"
        quiet: true
      vars:
        serials: >-
          {{ item | map(attribute='stdout') | map('regex_search', 'SOA\s+\S+\s+\S+\s+(\d+)', '\1')
             | map('first') | list }}
      loop: "{{ soa.results | groupby('item.1') | map('last') | list }}"
      loop_control:
        label: "{{ item[0].item.1 }}"

    - name: Resolve through the forward zone on ns2
      ansible.builtin.command: dig +short @127.0.0.1 target.elsewhere.test A
      register: fwd
      changed_when: false
      failed_when: fwd.stdout != '192.0.2.77'

- name: Verify transfer controls
  hosts: secondary
  gather_facts: false
  tasks:
    - name: Transfer the ACL-protected zone from the secondary's address
      ansible.builtin.command: dig @{{ test_ns1_ip }} elsewhere.test AXFR
      register: acl_xfr
      changed_when: false
      failed_when: "'target.elsewhere.test.' not in acl_xfr.stdout"

    - name: Transfer the TSIG zone without the key
      ansible.builtin.command: dig @{{ test_ns1_ip }} dyn.test AXFR
      register: nokey_xfr
      changed_when: false
      failed_when: "'Transfer failed' not in nokey_xfr.stdout"

    - name: Transfer the TSIG zone with the key
      ansible.builtin.command:
        argv: [dig, "-y", "hmac-sha256:xfer:{{ test_tsig_secret }}", "@{{ test_ns1_ip }}", dyn.test, AXFR]
      register: key_xfr
      changed_when: false
      no_log: true
      failed_when: "'seed.dyn.test.' not in key_xfr.stdout"

    # Ubuntu's AppArmor profile for dig, which also applies inside these
    # containers on an Ubuntu host, only lets +tls-ca read files under $HOME.
    - name: Copy the test CA for dig
      ansible.builtin.copy:
        src: "{{ test_pki }}/ca.pem"
        dest: /root/test-ca.pem
        mode: "0644"

    - name: Transfer the XoT zone over plain TCP with the key
      ansible.builtin.command:
        argv: [dig, "-y", "hmac-sha256:xfer:{{ test_tsig_secret }}", "@{{ test_ns1_ip }}", example.test, AXFR]
      register: plain_xfr
      changed_when: false
      no_log: true
      failed_when: "'Transfer failed' not in plain_xfr.stdout"

    - name: Transfer the XoT zone over TLS with the key
      ansible.builtin.command:
        argv: [dig, +tls, +tls-ca=/root/test-ca.pem, +tls-hostname=ns1.example.test,
               "-y", "hmac-sha256:xfer:{{ test_tsig_secret }}", "@{{ test_ns1_ip }}", example.test, AXFR]
      register: tls_xfr
      changed_when: false
      no_log: true
      failed_when: "'www.example.test.' not in tls_xfr.stdout"

- name: Verify server-side controls
  hosts: primary
  gather_facts: false
  tasks:
    - name: Transfer the ACL-protected zone from an address outside the ACL
      ansible.builtin.command: dig @127.0.0.1 elsewhere.test AXFR
      register: local_xfr
      changed_when: false
      failed_when: "'Transfer failed' not in local_xfr.stdout"

    - name: Find the TSIG key file
      ansible.builtin.find:
        paths: [/etc/named, /etc/bind]
        patterns: tsig-keys.conf
      register: keyfile

    - name: Check the key file is not world-readable
      ansible.builtin.assert:
        that:
          - keyfile.files | length == 1
          - keyfile.files[0].mode == '0640'
          - keyfile.files[0].pw_name == 'root'

    - name: Dump the effective configuration
      ansible.builtin.command: named-checkconf -p
      register: effective
      changed_when: false
      no_log: true

    - name: Check global defaults are closed
      ansible.builtin.assert:
        that:
          - effective.stdout is search('allow-transfer\s*\{\s*"?none"?;\s*\};')
          - effective.stdout is search('dnssec-validation auto;')
        quiet: true

- name: Verify the secondary keeps serving without the primary
  hosts: secondary
  gather_facts: false
  tasks:
    - name: Stop the primary
      ansible.builtin.service:
        name: named
        state: stopped
      delegate_to: "{{ test_primary }}"

    - name: Query the secondary while the primary is down
      ansible.builtin.command: dig +norec @127.0.0.1 www.example.test A
      register: failover
      changed_when: false
      failed_when: >-
        'status: NOERROR' not in failover.stdout
        or failover.stdout is not search('flags:[a-z ]* aa[ ;]')
        or '192.0.2.12' not in failover.stdout

  post_tasks:
    - name: Start the primary again
      ansible.builtin.service:
        name: named
        state: started
      delegate_to: "{{ test_primary }}"

- name: Verify local zones
  hosts: secondary
  gather_facts: false
  vars:
    servers: ["{{ test_ns1_ip }}", "{{ test_ns2_ip }}"]
  tasks:
    - name: Query a name inside an empty local zone
      ansible.builtin.command: dig +norec @{{ item }} anything.blocked.test A
      loop: "{{ servers }}"
      register: blocked
      changed_when: false
      failed_when: >-
        'status: NXDOMAIN' not in blocked.stdout
        or blocked.stdout is not search('flags:[a-z ]* aa[ ;]')

    - name: Query a local zone with records
      ansible.builtin.command: dig +short +norec @{{ item }} whatever.sink.test A
      loop: "{{ servers }}"
      register: sink
      changed_when: false
      failed_when: sink.stdout != '192.0.2.250'

    - name: Query a local zone restricted to localhost from another host
      ansible.builtin.command: dig +norec @{{ test_ns1_ip }} quiet.test SOA
      register: quiet
      changed_when: false
      failed_when: "'status: REFUSED' not in quiet.stdout"

    - name: Query the primary's query-restricted zone from the secondary
      ansible.builtin.command: dig +short +norec @{{ test_ns1_ip }} target.elsewhere.test A
      register: allowed
      changed_when: false
      failed_when: allowed.stdout != '192.0.2.77'

- name: Verify per-zone query restriction on the primary
  hosts: primary
  gather_facts: false
  tasks:
    - name: Query the restricted zone from outside its allow_query
      ansible.builtin.command: dig +norec @127.0.0.1 target.elsewhere.test A
      register: refused
      changed_when: false
      failed_when: "'status: REFUSED' not in refused.stdout"

- name: Verify dynamic updates
  hosts: secondary
  gather_facts: false
  vars:
    nsupdate_key: "hmac-sha256:ddns:{{ test_ddns_secret }}"
  tasks:
    - name: Resolve the seeded record on the secondary
      ansible.builtin.command: dig +short +norec @127.0.0.1 seed.dyn.test A
      register: seed
      changed_when: false
      failed_when: seed.stdout != '192.0.2.60'

    - name: Add a record with the update key
      ansible.builtin.command:
        argv: [nsupdate, -y, "{{ nsupdate_key }}"]
        stdin: |
          server {{ test_ns1_ip }}
          zone dyn.test
          update add new.dyn.test. 300 A 192.0.2.61
          send
      changed_when: true
      no_log: true

    - name: Wait for the update to reach the secondary
      ansible.builtin.command: dig +short +norec @127.0.0.1 new.dyn.test A
      register: updated
      changed_when: false
      until: updated.stdout == '192.0.2.61'
      retries: 15
      delay: 2

    - name: Try an update without a key
      ansible.builtin.command:
        argv: [nsupdate]
        stdin: |
          server {{ test_ns1_ip }}
          zone dyn.test
          update add rogue.dyn.test. 300 A 192.0.2.66
          send
      register: unsigned
      changed_when: false
      failed_when: "'REFUSED' not in unsigned.stderr + unsigned.stdout"

    - name: Try a record type the key may not change
      ansible.builtin.command:
        argv: [nsupdate, -y, "{{ nsupdate_key }}"]
        stdin: |
          server {{ test_ns1_ip }}
          zone dyn.test
          update add dyn.test. 300 MX 10 rogue.dyn.test.
          send
      register: wrong_type
      changed_when: false
      no_log: true
      failed_when: "'REFUSED' not in wrong_type.stderr + wrong_type.stdout"

- name: Run the role again on the primary
  hosts: primary
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

- name: Verify the dynamic zone kept its updates
  hosts: secondary
  gather_facts: false
  tasks:
    - name: Query the updated record on the primary
      ansible.builtin.command: dig +short +norec @{{ test_ns1_ip }} new.dyn.test A
      register: kept
      changed_when: false
      failed_when: kept.stdout != '192.0.2.61'

- name: Verify statistics and rate limiting
  hosts: bind
  gather_facts: false
  tasks:
    # Counters start at zero whenever named starts, and the failover check
    # restarts the primary, so query each zone here first.
    - name: Query zones with each statistics level
      ansible.builtin.command: dig +norec @127.0.0.1 {{ item }} SOA
      loop: [example.test, sink.test, blocked.test, second.test]
      changed_when: false

    - name: Read zone statistics
      ansible.builtin.uri:
        url: http://127.0.0.1:8053/json/v1/zones
        return_content: true
      register: stats

    - name: Check only zones with full statistics have query counters
      ansible.builtin.assert:
        that:
          - zones['example.test'].rcodes.QryAuthAns | default(0) | int > 0
          - zones['sink.test'].rcodes.QryAuthAns | default(0) | int > 0
          - "'rcodes' not in zones['blocked.test']"
          - "'second.test' not in zones"
        fail_msg: "{{ zones | to_json }}"
        quiet: true
      vars:
        zone_list: "{{ stats.json.views._default.zones }}"
        zones: "{{ dict(zone_list | map(attribute='name') | zip(zone_list)) }}"

    - name: Dump the effective configuration
      ansible.builtin.command: named-checkconf -p
      register: effective
      changed_when: false
      no_log: true

    - name: Check rate limiting and the global statistics level
      ansible.builtin.assert:
        that:
          - effective.stdout is search('rate-limit\s*\{')
          - effective.stdout is search('responses-per-second 20;')
          - effective.stdout is search('log-only yes;')
          - effective.stdout is search('zone-statistics terse;')
        quiet: true

- name: Verify encrypted DNS
  hosts: secondary
  gather_facts: false
  vars:
    servers:
      - {ip: "{{ test_ns1_ip }}", name: ns1.example.test}
      - {ip: "{{ test_ns2_ip }}", name: ns2.example.test}
  tasks:
    - name: Query over DoT, checking each server's certificate
      ansible.builtin.command:
        argv: [dig, +short, +tls, +tls-ca=/root/test-ca.pem, "+tls-hostname={{ item.name }}",
               "@{{ item.ip }}", www.example.test, A]
      loop: "{{ servers }}"
      register: dot
      changed_when: false
      failed_when: dot.stdout != '192.0.2.12'

    - name: Query over DoH, checking each server's certificate
      ansible.builtin.command:
        argv: [dig, +short, +https, +tls-ca=/root/test-ca.pem, "+tls-hostname={{ item.name }}",
               "@{{ item.ip }}", www.example.test, A]
      loop: "{{ servers }}"
      register: doh
      changed_when: false
      failed_when: doh.stdout != '192.0.2.12'

    - name: Query over DoT expecting a name the certificate does not hold
      ansible.builtin.command:
        argv: [dig, +tls, +tls-ca=/root/test-ca.pem, +tls-hostname=wrong.example.test,
               +tries=1, +timeout=3, "@{{ test_ns1_ip }}", www.example.test, A]
      register: wrong_name
      changed_when: false
      failed_when: >-
        '192.0.2.12' in wrong_name.stdout
        or 'verification' not in wrong_name.stdout + wrong_name.stderr

- name: Verify TLS files and settings
  hosts: bind
  gather_facts: false
  tasks:
    - name: Find the TLS private key
      ansible.builtin.find:
        paths: [/etc/named/tls, /etc/bind/tls]
        patterns: server.key
      register: tls_key

    - name: Check the private key is not world-readable
      ansible.builtin.assert:
        that:
          - tls_key.files | length == 1
          - tls_key.files[0].mode == '0640'
          - tls_key.files[0].pw_name == 'root'

    - name: Dump the effective configuration
      ansible.builtin.command: named-checkconf -p
      register: effective
      changed_when: false
      no_log: true

    - name: Check TLS hardening
      ansible.builtin.assert:
        that:
          - effective.stdout is search('protocols\s*\{\s*"?TLSv1.2"?;\s*"?TLSv1.3"?;\s*\};')
          - effective.stdout is search('session-tickets no;')
          - effective.stdout is search('prefer-server-ciphers yes;')
        quiet: true

- name: Verify v5 leftovers are gone
  hosts: bind
  gather_facts: true
  vars:
    v5_conf_dir: "{{ '/etc/named' if ansible_facts['os_family'] == 'RedHat' else '/etc/bind' }}"
    v5_dir: "{{ '/var/named' if ansible_facts['os_family'] == 'RedHat' else '/var/cache/bind' }}"
    v5_removed:
      - "{{ v5_conf_dir }}/auth_transfer.conf"
      - "{{ v5_dir }}/gone.test"
    # On EL the v5 zone and secondary directories differ from v6's; on
    # Debian the secondary directory is the same, and v6 zones live elsewhere.
    v5_removed_el:
      - /var/named/secondary
    v5_removed_debian:
      - /var/cache/bind/example.test
    v5_kept:
      - "{{ v5_dir }}/not-ours.zone"
  tasks:
    - name: Look for each path
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: >-
        {{ v5_removed + v5_kept
           + (v5_removed_el if ansible_facts['os_family'] == 'RedHat' else v5_removed_debian) }}
      register: v5_paths

    - name: Check what was removed and what was kept
      ansible.builtin.assert:
        that: item.stat.exists == (item.item in v5_kept)
        fail_msg: "{{ item.item }} {{ 'is missing' if item.item in v5_kept else 'is still there' }}"
        quiet: true
      loop: "{{ v5_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check the primary's current zone file is still there
      ansible.builtin.stat:
        path: "{{ '/var/named' if ansible_facts['os_family'] == 'RedHat' else '/var/lib/bind' }}/example.test"
      register: v5_current
      failed_when: not v5_current.stat.exists
      when: inventory_hostname in groups['primary']
