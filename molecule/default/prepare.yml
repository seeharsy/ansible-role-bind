---
# A throwaway CA and one certificate per server, created on the controller in
# Molecule's temporary directory. Nothing here is reused outside the test.
- name: Create the test CA
  hosts: localhost
  gather_facts: false
  vars:
    test_pki: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"
  tasks:
    - name: Create the PKI directory
      ansible.builtin.file:
        path: "{{ test_pki }}"
        state: directory
        mode: "0700"

    - name: Create the CA
      ansible.builtin.command:
        argv: [openssl, req, -x509, -newkey, ec, -pkeyopt, "ec_paramgen_curve:P-256", -nodes,
               -keyout, ca.key, -out, ca.pem, -days, "2", -subj, "/CN=Molecule test CA",
               -addext, "basicConstraints=critical,CA:TRUE",
               -addext, "keyUsage=critical,keyCertSign,cRLSign"]
        chdir: "{{ test_pki }}"
        creates: ca.pem

- name: Create server certificates
  hosts: bind
  gather_facts: false
  tasks:
    - name: Write certificate extensions
      ansible.builtin.copy:
        dest: "{{ test_pki }}/{{ test_tls_name }}.ext"
        content: |
          subjectAltName=DNS:{{ test_tls_name }},IP:{{ test_ip }}
          extendedKeyUsage=serverAuth
          keyUsage=critical,digitalSignature
        mode: "0600"
      delegate_to: localhost

    - name: Create a key and signing request
      ansible.builtin.command:
        argv: [openssl, req, -newkey, ec, -pkeyopt, "ec_paramgen_curve:P-256", -nodes,
               -keyout, "{{ test_tls_name }}.key", -out, "{{ test_tls_name }}.csr",
               -subj, "/CN={{ test_tls_name }}"]
        chdir: "{{ test_pki }}"
        creates: "{{ test_tls_name }}.key"
      delegate_to: localhost

    - name: Sign the server certificate
      ansible.builtin.command:
        argv: [openssl, x509, -req, -in, "{{ test_tls_name }}.csr", -CA, ca.pem, -CAkey, ca.key,
               -CAcreateserial, -days, "2", -extfile, "{{ test_tls_name }}.ext",
               -out, "{{ test_tls_name }}.pem"]
        chdir: "{{ test_pki }}"
        creates: "{{ test_tls_name }}.pem"
      delegate_to: localhost

# Files a v5 server would have, so converge shows what the role removes and
# what it leaves alone.
- name: Leave v5 files behind
  hosts: bind
  gather_facts: true
  vars:
    v5_conf_dir: "{{ '/etc/named' if ansible_facts['os_family'] == 'RedHat' else '/etc/bind' }}"
    v5_dir: "{{ '/var/named' if ansible_facts['os_family'] == 'RedHat' else '/var/cache/bind' }}"
  tasks:
    - name: Create the v5 directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ v5_conf_dir }}"
        - "{{ v5_dir }}"
        - "{{ v5_dir }}/secondary"

    - name: Write v5 files
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0640"
      loop:
        - path: "{{ v5_conf_dir }}/auth_transfer.conf"
          content: "server 192.0.2.1 { keys { old; }; };\n"
        - path: "{{ v5_dir }}/gone.test"
          content: "; Hash: 0123456789abcdef0123456789abcdef 1791680000\n; zone removed from the inventory\n"
        - path: "{{ v5_dir }}/example.test"
          content: "; Hash: fedcba9876543210fedcba9876543210 1791680000\n; v5 copy\n"
        - path: "{{ v5_dir }}/secondary/example.test"
          content: "v5 secondary copy\n"
        - path: "{{ v5_dir }}/not-ours.zone"
          content: "; written by something else\n"
      loop_control:
        label: "{{ item.path }}"
