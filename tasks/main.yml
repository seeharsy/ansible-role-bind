---
- name: Check the platform is supported
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: >-
      This role supports EL 9/10, Debian 12/13 and Ubuntu 24.04, not
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true
  tags: bind

- name: Load platform variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: bind

- name: Load version-specific overrides
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ lookup('ansible.builtin.first_found', __bind_version_vars, errors='ignore', wantlist=True) }}"
  vars:
    __bind_version_vars:
      files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
      paths: ["{{ role_path }}/vars"]
  tags: bind

- name: Validate zone definitions
  ansible.builtin.assert:
    that: bind_zones | bind_validate_zones(inventory_hostname, __bind_zone_defaults)
    quiet: true
  tags: bind

- name: Validate TSIG keys
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9_.-]+$')
      - item.algorithm in ['hmac-sha256', 'hmac-sha384', 'hmac-sha512', 'hmac-sha224', 'hmac-sha1', 'hmac-md5']
      - item.secret is match('^[A-Za-z0-9+/]+={0,2}$')
    fail_msg: >-
      TSIG key {{ item.name | default('?') }}: the name may contain only letters, digits,
      '.', '-' and '_', the algorithm must be an HMAC algorithm, and the secret must be base64.
    quiet: true
  loop: "{{ bind_tsig_keys }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  no_log: true
  tags: bind

- name: Install BIND
  ansible.builtin.include_tasks: install.yml
  tags: bind

- name: Configure BIND
  ansible.builtin.include_tasks: configure.yml
  tags: bind

- name: Start and enable BIND
  ansible.builtin.service:
    name: "{{ bind_service }}"
    state: started
    enabled: true
  tags: bind
