---
# Addresses and port for plain DNS. An empty list disables that family.
bind_listen: {}
#  ipv4: [127.0.0.1]
#  ipv6: ["::1"]
#  port: 53

# Named address match lists. ACLs grant nothing by themselves; use their
# names in bind_options or in a zone's allow_* settings.
bind_acls: []
#  - name: clients
#    match: [192.0.2.0/24, localhost]

# Server-wide options. Anything you leave out keeps the default shown here.
bind_options: {}
#  recursion: false
#  allow_query: [localhost]
#  allow_recursion: [localhost, localnets]
#  allow_transfer: [none]
#  forwarders: []
#  forward: first              # or "only"
#  dnssec_validation: auto     # auto | "yes" (needs your own trust-anchors) | "no"
#  validate_except: []         # names not to validate, e.g. private namespaces
#  query_log: false
#  zone_statistics: terse      # full | terse | none; unset keeps BIND's default (terse)
#  rate_limit: {}              # response rate limiting; off unless set, see README

# Raw named.conf statements appended inside the options block.
bind_options_extra: ""

# TSIG keys, written to a separate file readable only by root and BIND.
# Generate a secret with: tsig-keygen -a hmac-sha256 <name>
bind_tsig_keys: []
#  - name: xfer
#    algorithm: hmac-sha256
#    secret: "{{ vault_bind_xfer_secret }}"

# Certificate for DoT, DoH and XoT, from your CA. Give PEM content (keep the
# key in Ansible Vault) or paths to files already on the host, not both.
bind_tls: {}
#  cert: "{{ lookup('file', 'pki/ns1.pem') }}"   # server certificate + intermediates
#  key: "{{ vault_bind_tls_key }}"
#  ca: "{{ lookup('file', 'pki/ca.pem') }}"      # CA that signed the primaries, for XoT
#  cert_file: /etc/pki/tls/certs/ns1.pem        # instead of cert
#  key_file: /etc/pki/tls/private/ns1.key       # instead of key
#  ca_file: /etc/pki/tls/certs/ca.pem           # instead of ca
#  protocols: [TLSv1.2, TLSv1.3]
#  ciphers: "ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!SHA1:!SHA256:!SHA384"   # TLS 1.2 only

# DNS over TLS, on the bind_listen addresses.
bind_dot: {}
#  enabled: false
#  port: 853

# DNS over HTTPS, on the bind_listen addresses.
bind_doh: {}
#  enabled: false
#  port: 443
#  endpoints: [/dns-query]

# SOA and TTL defaults. Each zone can override any of these.
bind_zone_defaults: {}
#  ttl: 1h
#  refresh: 1d
#  retry: 1h
#  expire: 1w
#  minimum: 1h
#  hostmaster: hostmaster

# Zones. See README for every key.
bind_zones: []

# Zones every server answers by itself, e.g. to make lookups for names that
# can never resolve fail at once. Without records, nothing inside them exists.
bind_local_zones: []
#  - name: example.com
#  - name: sinkhole.example
#    records:
#      - {name: "*", type: A, value: 192.0.2.1}

# Statistics channel (HTTP/XML/JSON). Off by default.
bind_statistics: {}
#  enabled: false
#  host: 127.0.0.1
#  port: 8053
#  allow: [127.0.0.1]

# Extra files to include at the end of named.conf.
bind_extra_include_files: []

# "present" or "latest". Upgrading BIND on every run is your choice to make.
bind_package_state: present

# Paths and names. The defaults come from the platform's vars file.
bind_packages: "{{ __bind_os_packages }}"
bind_service: "{{ __bind_os_service }}"
bind_config: "{{ __bind_os_config }}"
bind_conf_dir: "{{ __bind_os_conf_dir }}"
bind_dir: "{{ __bind_os_dir }}"
bind_zone_dir: "{{ __bind_os_zone_dir }}"
bind_secondary_dir: "{{ __bind_os_secondary_dir }}"
bind_dynamic_dir: "{{ __bind_os_dynamic_dir }}"
bind_user: "{{ __bind_os_user }}"
bind_group: "{{ __bind_os_group }}"
