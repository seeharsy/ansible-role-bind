---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip3 install ansible-core ansible-lint yamllint pytest

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Reject non-ASCII whitespace in templates
        run: "! grep -rnP '[\\x{00A0}\\x{2000}-\\x{200B}\\x{202F}\\x{FEFF}]' templates"

      - name: Run unit tests
        run: pytest -q tests/unit

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux9
            image: docker.io/rockylinux/rockylinux:9
          - distro: rockylinux10
            image: docker.io/rockylinux/rockylinux:10
          - distro: debian12
            image: docker.io/library/debian:12
          - distro: debian13
            image: docker.io/library/debian:13
          - distro: ubuntu2404
            image: docker.io/library/ubuntu:24.04
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip3 install ansible-core molecule "molecule-plugins[docker]"
          ansible-galaxy collection install community.docker

      - name: Run Molecule
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_IMAGE: ${{ matrix.image }}
