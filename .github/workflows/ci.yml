---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # The inherited v5 code predates current ansible-lint rules. Linting is
    # reported but not enforced until the v6 refactor lands; Molecule tests
    # for the v6 platform matrix are added in that same change.
    continue-on-error: true
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip3 install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint
